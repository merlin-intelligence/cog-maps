version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: eigenmind_qdrant
    restart: always
    # Bind to localhost only — Qdrant has no auth of its own unless
    # QDRANT_API_KEY is set below, and the app expects to reach it locally.
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:?Set QDRANT_API_KEY in your .env file}
    # Docker's default soft limit (1024 open files) is too low for Qdrant: each
    # segment's RocksDB storage keeps many files open, and every client
    # connection takes a descriptor too — past it, writes fail with
    # "Too many open files (os error 24)".
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      - qdrant_storage:/qdrant/storage

  oxigraph:
    image: ghcr.io/oxigraph/oxigraph:latest
    container_name: eigenmind_oxigraph
    restart: always
    command: serve --location /data --bind 0.0.0.0:7878
    # Bind to localhost only, same reasoning as Qdrant above — Oxigraph has
    # no auth of its own and the app expects to reach it locally.
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      - oxigraph_storage:/data

volumes:
  qdrant_storage:
  oxigraph_storage: